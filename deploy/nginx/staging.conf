# forumdev.tigerapps.org → The Forum (staging) on 127.0.0.1:3100. TLS terminates at Cloudflare.
server {
    listen 80;
    server_name forumdev.tigerapps.org;
    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
# Old staging hostname.
server {
    listen 80;
    server_name theforumdev.tigerapps.org;
    return 301 https://forumdev.tigerapps.org$request_uri;
}
