name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No secrets needed: env validation is skipped and every value is a dummy.
      SKIP_ENV_VALIDATION: "1"
      AUTH_SECRET: ci-dummy-auth-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-dummy
      NEXT_PUBLIC_CAMPUS_MAP_TOKEN: pk.ci-dummy
      NEXT_PUBLIC_CAMPUS_MAP_STYLE: mapbox://styles/ci/dummy
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # bun.lock uses configVersion (Bun >= 1.3).
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (apps/web)
        run: bunx tsc --noEmit -p apps/web

      - name: Unit tests (apps/web)
        working-directory: apps/web
        run: bun test

      - name: Build (apps/web)
        run: bun run build --filter=@the-forum/web
